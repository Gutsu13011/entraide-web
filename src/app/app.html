<header>
  <h1>Entraide</h1>
  <p>Ici vous trouvez toute l'aide dont vous avez besoin pour vos petits travaux.</p>
  <nav aria-label="Navigation principale">
    <a [routerLink]="['/']">Prestataires</a>
    <div class="account-actions">
      @if (authSession.currentUser(); as user) {
        <p class="session-user">{{ user.firstName }} {{ user.lastName }}</p>
        <button type="button" (click)="authSession.logout()">Se déconnecter</button>
      } @else {
        <a [routerLink]="['/login']">Se connecter</a>
        <a [routerLink]="['/register']">Créer un compte</a>
      }
    </div>
  </nav>
</header>
<main>
  <router-outlet></router-outlet>
</main>
